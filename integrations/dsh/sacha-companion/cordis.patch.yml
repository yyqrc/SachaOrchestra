# Single Sacha companion for one DSH Profile. The host row owns Root tool-surface
# policy and visualization; the remaining rows expose continuable child surfaces.
- insert:
    - id: sacha-companion
      name: '@sacha-orchestra/dsh-companion'

    - id: sacha-research-posix
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: !!js process.platform === 'win32'
      config:
        provider: spawn
        toolName: sacha_research
        backgroundMode: continuable
        maxDepth: 1
        persona: >-
          You are a focused investigation subagent. Work from the supplied self-contained scope,
          gather facts and evidence, and return a compact report with references and unknowns.
          Do not modify project state and do not create or coordinate other agents.
        toolFilter:
          allow:
            - read
            - read_image
            - glob
            - grep
            - web_search
            - skill

    - id: sacha-research-windows
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: !!js process.platform !== 'win32'
      config:
        provider: spawn
        toolName: sacha_research
        backgroundMode: continuable
        maxDepth: 1
        persona: >-
          You are a focused investigation subagent. Work from the supplied self-contained scope,
          gather facts and evidence, and return a compact report with references and unknowns.
          Do not modify project state and do not create or coordinate other agents.
        toolFilter:
          allow:
            - read
            - read_image
            - glob
            - grep
            - web_search
            - skill

    - id: sacha-worker
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: sacha_worker
        backgroundMode: continuable
        maxDepth: 1
        persona: >-
          You are a scoped implementation subagent. Implement only the supplied work unit,
          verify the direct result, and report the delta, evidence, risks, and any coordination
          request to the parent. Do not create or coordinate other agents.
        # 只 deny 在目标 scope 中确实可限制的名字。`tools.restrict()` 按
        # `restrictableNames` 校验，该集合只含 scope 继承来的名字：scope 自身注册的工具
        # 虽可见、也计入 known，却不可 restrict。实测 sacha_worker 的 child scope 中
        # `subagent` 即“可见但不可限制”，`workflow` 在 PTC preset 下 disabled；两者都
        # 不得写入 —— deny 一个不可限制的名字不收紧任何东西，只会让整个 sacha_worker
        # 无法创建。嵌套派发由 `maxDepth: 1` 约束。
        toolFilter:
          deny:
            - subagent_fork

    - id: sacha-review-posix
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: !!js process.platform === 'win32'
      config:
        provider: spawn
        toolName: sacha_review
        backgroundMode: continuable
        maxDepth: 1
        persona: >-
          You are an independent verification subagent. Review only the supplied final scope,
          implementation references, and raw evidence. You may run verification commands, but do
          not edit project files and do not create or coordinate other agents. If a defect exists,
          report it to the parent instead of fixing it yourself.
        toolFilter:
          allow:
            - read
            - read_image
            - glob
            - grep
            - bash
            - skill

    - id: sacha-review-windows
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: !!js process.platform !== 'win32'
      config:
        provider: spawn
        toolName: sacha_review
        backgroundMode: continuable
        maxDepth: 1
        persona: >-
          You are an independent verification subagent. Review only the supplied final scope,
          implementation references, and raw evidence. You may run verification commands, but do
          not edit project files and do not create or coordinate other agents. If a defect exists,
          report it to the parent instead of fixing it yourself.
        toolFilter:
          allow:
            - read
            - read_image
            - glob
            - grep
            - pwsh
            - skill
